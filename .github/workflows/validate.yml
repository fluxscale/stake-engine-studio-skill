name: Validate skill

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/validate.py
      - run: python -m unittest discover -s tests -v

  discovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Verify skills CLI discovery
        env:
          DISABLE_TELEMETRY: '1'
          # The CLI colours output whenever CI is set; strip ANSI codes as well in case NO_COLOR is ignored.
          NO_COLOR: '1'
        run: |
          set -o pipefail
          npx --yes skills@1.7.0 add . --list | tee /tmp/skill-discovery.txt
          python3 -c "import pathlib, re; text = re.sub(r'\x1b\[[0-9;]*m', '', pathlib.Path('/tmp/skill-discovery.txt').read_text(encoding='utf-8')); assert any(line.strip().lstrip('│').strip() == 'stake-engine-studio' for line in text.splitlines()), 'Skill not discovered'"
